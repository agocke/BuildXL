name: Build

on:
  push:
    branches: [ runtime ]
  pull_request:
    branches: [ runtime ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore BuildXL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bxl
          key: bxl-cache-${{ github.sha }}
          restore-keys: bxl-cache-
          save-always: true

      - name: Install bxl
        run: |
          dotnet tool install -g agtest.bxl.tool \
            --version "0.2.0-ci.2.4c5faf0-devBuild"
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: false

      - name: Build and test
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            "/p:[Sdk.BuildXL]buildEBPFSandbox=0" \
            /EnableLinuxEBPFSandbox- \
            "/p:EnableLinuxEBPFSandboxForTests=0" \
            "/p:MAJOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f1)" \
            "/p:MINOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f2)" \
            "/f:spec='*FrontEnd/UnitTests/*'"

      - name: Build packages
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            /q:ReleaseLinux \
            "/p:[Sdk.BuildXL]buildEBPFSandbox=0" \
            /EnableLinuxEBPFSandbox- \
            "/p:MAJOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f1)" \
            "/p:MINOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f2)" \
            "/f:output='*public/pkgs/*'"

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore BuildXL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bxl
          key: bxl-cache-win-${{ github.sha }}
          restore-keys: bxl-cache-win-
          save-always: true

      - name: Enable USN journal
        shell: cmd
        run: fsutil usn createjournal m=0x20000000 a=0x8000000 %CD:~0,2%

      - name: Build packages
        shell: cmd
        run: |
          call bxl.cmd /server- ^
            /cacheDirectory:%USERPROFILE%\.cache\bxl ^
            /q:Release ^
            "/f:output='*public/pkgs/*'"
