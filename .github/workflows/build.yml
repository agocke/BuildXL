name: Build

on:
  push:
    branches: [ runtime ]
  pull_request:
    branches: [ runtime ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore BuildXL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bxl
          key: bxl-cache-${{ github.sha }}
          restore-keys: bxl-cache-
          save-always: true

      - name: Install bxl
        run: |
          dotnet tool install -g agtest.bxl.tool \
            --version "0.2.0-ci.9.9e337b3"
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: false

      - name: Build and test
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            "/p:[Sdk.BuildXL]buildEBPFSandbox=0" \
            /EnableLinuxEBPFSandbox- \
            "/p:EnableLinuxEBPFSandboxForTests=0" \
            "/p:MAJOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f1)" \
            "/p:MINOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f2)" \
            "/f:spec='*FrontEnd/UnitTests/*'"

      - name: Build packages
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            /q:ReleaseLinux \
            "/p:[Sdk.BuildXL]buildEBPFSandbox=0" \
            /EnableLinuxEBPFSandbox- \
            "/p:MAJOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f1)" \
            "/p:MINOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f2)" \
            "/f:output='*public/pkgs/*'"

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore BuildXL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bxl
          key: bxl-cache-win-${{ github.sha }}
          restore-keys: bxl-cache-win-
          save-always: true

      - name: Install bxl
        shell: bash
        run: |
          dotnet tool install -g agtest.bxl.tool \
            --version "0.2.0-ci.9.9e337b3"
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: false

      - name: Detect MSVC version
        shell: pwsh
        run: |
          $msvcRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          if (-not (Test-Path $msvcRoot)) { throw "MSVC not found at $msvcRoot" }
          $version = (Get-ChildItem $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Detected MSVC version: $version"
          "MSVC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build win-x64 packages
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            /unsafe_DisableDetours+ \
            /q:Release \
            "/f:spec='*DotnetToolPackages*'"
