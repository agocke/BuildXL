name: Publish to NuGet

on:
  push:
    branches:
      - runtime
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore BuildXL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bxl
          key: bxl-cache-${{ github.sha }}
          restore-keys: bxl-cache-

      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SEMVER=0.2.0" >> $GITHUB_OUTPUT
          echo "PRERELEASE=ci.${{ github.run_number }}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Building version: 0.2.0-ci.${{ github.run_number }}.${SHORT_SHA}"

      - name: Install bxl
        run: |
          dotnet tool install -g agtest.bxl.tool \
            --version "0.2.0-ci.2.4c5faf0-devBuild"
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: false

      - name: Build packages
        run: |
          bxl /c:config.dsc /server- \
            /cacheDirectory:$HOME/.cache/bxl \
            /q:ReleaseLinux \
            "/p:[Sdk.BuildXL]buildEBPFSandbox=0" \
            /EnableLinuxEBPFSandbox- \
            "/p:[Sdk.BuildXL]experimentalDeployment=1" \
            "/p:MAJOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f1)" \
            "/p:MINOR_KERNEL_VERSION=$(uname -r | cut -d'.' -f2)" \
            "/p:[BuildXL.Branding]SemanticVersion=${{ steps.version.outputs.SEMVER }}" \
            "/p:[BuildXL.Branding]PrereleaseTag=${{ steps.version.outputs.PRERELEASE }}" \
            "/f:spec='*DotnetToolPackages*'"

      - name: Collect packages
        run: |
          mkdir -p ./artifacts
          find Out -name "agtest.bxl*.nupkg" -exec cp {} ./artifacts/ \;
          echo "Packages to publish:"
          ls -la ./artifacts/

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
